# 銀爺爺的營運設定：AI 模型、點數費用、新會員贈點
#
# ── 怎麼改 ──────────────────────────────────────────────────────
#   1. 改這個檔案
#   2. python3 -m src.core.settings      ← 先驗，會印出實際生效的值
#   3. git commit && git push            ← Railway 自動部署，約 1～2 分鐘
#
# 設定寫錯不會上線：CI 會擋下 PR，Railway 部署前也會再驗一次並中止部署。
#
# ── 換模型的步驟 ────────────────────────────────────────────────
#   1. 到 https://replicate.com/explore 找模型，複製它的 ID（作者/模型名）
#   2. 打開該模型的 API 頁，看它的輸入欄位叫什麼名字
#   3. 把 model 換掉，並照著調整下面的 input 對應
#   4. 本地實測一次再推（見 docs/TEST_ENVIRONMENT.md）
#
# 光換 model 是不夠的：不同模型的欄位名稱不一樣。例如 nano-banana 的圖片
# 欄位叫 image_input 且吃「陣列」，restore-image 叫 input_image 吃「單張」。
# 對應沒改的話換完模型會直接失敗（會退點給用戶，但每次都失敗）。

# ══════════════════════════════════════════════════════════════
# 功能：用哪個模型、扣幾點
# ══════════════════════════════════════════════════════════════
#
#   model            Replicate 模型 ID
#   cost             每次使用扣幾點
#   loading_seconds  LINE 轉圈動畫顯示幾秒（5 的倍數，5～60；抓比實際處理
#                    時間略長一點，動畫會在結果送出時自動停止）
#   input.image_field    圖片要放進模型的哪個欄位
#   input.image_is_list  該欄位吃陣列（true）還是單一值（false）
#   input.prompt_field   文字描述放哪個欄位；不吃描述的模型留 null
#   extra_input          固定附加的參數，照抄模型 API 頁上的欄位名

features:

  # P圖大神：傳圖 → 選（或打）修改描述 → 確認後扣點
  edit:
    model: google/nano-banana-2
    cost: 5
    loading_seconds: 45
    input:
      image_field: image_input
      image_is_list: true
      prompt_field: prompt
    extra_input:
      output_format: jpg

  # 照片動起來：傳照片 → 產生 5 秒微動影片
  #
  # 這是唯一輸出「影片」的功能，點數也最貴（成本約是彩色化的 2.5 倍）。
  # default_prompt 是這個功能的品質主控鈕——它固定送給模型，用戶不需輸入。
  # 刻意寫得極度克制：長輩看的是過世親人的照片，五官跑掉會從感動變成不安，
  # 所以寧可動得少也不能壞。想調整動作幅度就改這段文字，不必改程式碼。
  animate:
    model: prunaai/p-video
    cost: 25
    loading_seconds: 60
    input:
      image_field: image
      image_is_list: false
      prompt_field: prompt
      default_prompt: >
        The people in this vintage portrait smile warmly and give a small,
        gentle wave to the camera in a friendly greeting — the hand stays low,
        near waist level, moving only slightly from the wrist. Do not raise or
        lift the arms. Natural, gentle, minimal human movement.
        Keep every face perfectly stable and identical throughout — no morphing,
        no distortion, no change of identity or age. They stay standing in the
        same positions; the background and objects remain unchanged.
        Photorealistic, warm, respectful, documentary style.
    extra_input:
      duration: 5
      resolution: 720p
      aspect_ratio: "16:9"
      fps: 24

  # 圖片彩色化：傳黑白照 → 自動上色
  #
  # 2026-08 換掉原本的 flux-kontext-apps/restore-image：那是「修復」導向的
  # 模型（去刮痕、去噪很強），上色只是附帶，實測遇到泛黃的翻拍老照片時
  # 幾乎不上色，長輩會覺得「怎麼沒變彩色」。改用通用編輯模型並明確下達
  # 上色指令，效果好很多。
  #
  # default_prompt 特別交代「不要改動任何中文字」：老照片常有匾額、題字、
  # 日期，生成式模型很容易把字重寫錯，而那往往是照片的歷史核心。
  colorize:
    model: google/nano-banana-2
    cost: 10
    loading_seconds: 30
    input:
      image_field: image_input
      image_is_list: true
      prompt_field: prompt
      default_prompt: >
        Restore and colorize this old photograph with natural, realistic,
        period-accurate colors. Remove any sepia or yellow cast and produce
        true colors with realistic skin tones and natural daylight.
        CRITICAL: preserve all Chinese characters, calligraphy, plaques and
        handwritten dates EXACTLY as they appear — never redraw, correct or
        invent text. Keep every person's face, expression, hairstyle and
        clothing identical; keep the original composition, framing and
        photographic grain. Do not add or remove anything.
    extra_input:
      output_format: jpg

# ══════════════════════════════════════════════════════════════
# 會員
# ══════════════════════════════════════════════════════════════

members:
  # 新用戶加好友時贈送的點數。設 0 表示不送。
  # 同一個帳號只會發一次（解除封鎖再加回來不會重複領）。
  welcome_points: 50

# ══════════════════════════════════════════════════════════════
# 儲值（點數包）
# ══════════════════════════════════════════════════════════════
#
# 整段拿掉 = 關閉儲值功能（程式會照常運作，只是沒有付款入口）。
# 這份點數包同時也是「禮物卡」的方案清單（/gift 頁），兩邊定價一致。
# 留著但填錯會讓部署中止——寧可不上線，也不要靜悄悄地關掉金流。
#
#   provider    目前只支援 ecpay（綠界）
#   id          點數包代號，1～16 個英數字；會被放進綠界訂單編號，改了會影響對帳
#   points      買到幾點
#   price_twd   台幣定價
#   label       顯示給用戶看的名稱（省略的話自動用「N 點」）
#
# ⚠️ 下面的定價是「範例」，上線前務必用實際成本回推：每次處理的 Replicate
# 費用 + 金流手續費（信用卡約 3%、超商每筆另有固定成本）都要算進去。
# 已經開立的訂單會鎖住當下的點數與金額，所以改價不會影響還沒付款的舊單。
#
# 改完記得跑 python3 -m src.core.settings 確認實際生效的值。

payments:
  provider: ecpay
  packages:
    - id: s
      points: 100
      price_twd: 100
      label: 100 點
    - id: m
      points: 300
      price_twd: 250
      label: 300 點
    - id: l
      points: 600
      price_twd: 450
      label: 600 點

# ══════════════════════════════════════════════════════════════
# 其他可用的模型（想換時參考，欄位對應已附上）
# ══════════════════════════════════════════════════════════════
#
# 圖片編輯：
#   black-forest-labs/flux-kontext-pro
#     input: {image_field: input_image, image_is_list: false, prompt_field: prompt}
#     extra_input: {output_format: jpg}
#   qwen/qwen-image-edit
#     input: {image_field: image, image_is_list: false, prompt_field: prompt}
#
# 老照片修復／上色：
#   flux-kontext-apps/restore-image
#     input: {image_field: input_image, image_is_list: false, prompt_field: null}
#   tencentarc/gfpgan          （偏人臉修復，不上色）
#     input: {image_field: img, image_is_list: false, prompt_field: null}
#
# ── 臨時調整（不想部署時） ──────────────────────────────────────
# Railway 的 Variables 設這些環境變數可覆寫本檔：
#   EDIT_COST / COLORIZE_COST / EDIT_MODEL / COLORIZE_MODEL / WELCOME_POINTS
# 但覆寫會蓋過這裡的值——調完記得移除，否則之後改本檔會看不出效果。
# python3 -m src.core.settings 印的是套用覆寫後的實際值。
