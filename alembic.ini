# Alembic 設定。只管理 grandpa_yin.* 產品層 schema；
# public.* 共用層由 Altide 的 supabase/schema.sql 管理，見 alembic/env.py 的 include_object。
#
# 未列出的選項一律採 Alembic 預設值（完整清單見官方文件），
# 這裡只保留本專案實際會用到的設定。

[alembic]
# migration 腳本位置（%(here)s = 本檔所在目錄）
script_location = %(here)s/alembic

# 專案根目錄加入 sys.path，讓 env.py import 得到 src 套件
prepend_sys_path = .

path_separator = os

# 檔名格式：時間戳 + 描述，例如 20260809235858_add_standalone_identity_and_wallet.py。
# 用時間戳開頭讓 versions/ 目錄天然依時序排列（對齊 Prisma migrations 的慣例）；
# revision id 不在檔名裡，要用 id 找檔案可 `grep -rl <id> alembic/versions/`
# 或 `alembic history`。%% 是 configparser 的跳脫寫法。
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# 連線字串由 env.py 從 DATABASE_URL 環境變數注入（見 alembic/env.py），
# 不在此檔設定，避免祕密進版控或與 .env 不一致。
sqlalchemy.url =


# 日誌設定，由 env.py 的 fileConfig() 讀取
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
