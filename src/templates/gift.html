<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送點數給朋友</title>
<style>
  /* Unlike pay.html, the reader here is the adult child, not the elder — but
     the layout stays the same shape so both pages feel like one service. One
     column, centred on desktop, identical on phone and inside the LINE
     in-app browser. */
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    margin: 0; padding: 1.5rem 1.25rem 3rem;
    background: #fff; color: #1a1a1a; line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 26rem; margin: 0 auto; }
  h1 { font-size: 1.7rem; margin: 0.5rem 0 0.25rem; }
  .lead { font-size: 1.15rem; color: #444; margin: 0 0 1.5rem; }
  .steps {
    margin: 0 0 1.75rem; padding: 1rem 1.15rem;
    background: #faf7f2; border-radius: 0.7rem; font-size: 1.05rem; color: #444;
  }
  .steps ol { margin: 0; padding-left: 1.3rem; }
  .steps li { margin: 0.35rem 0; }
  .pkg {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; box-sizing: border-box;
    padding: 1.25rem 1.35rem; margin-bottom: 1rem;
    font-family: inherit; font-size: 1.35rem; text-align: left;
    background: #fff; color: #1a1a1a;
    border: 2px solid #1a1a1a; border-radius: 0.9rem;
    cursor: pointer;
  }
  .pkg:active { background: #f0f0f0; }
  .pkg:disabled { opacity: 0.45; cursor: default; }
  .pkg .points { font-weight: 700; }
  .pkg .price { font-size: 1.25rem; white-space: nowrap; }
  .note { font-size: 1.05rem; color: #666; margin-top: 1.75rem; }
  .msg {
    display: none; margin: 1.25rem 0 0; padding: 1rem 1.15rem;
    font-size: 1.15rem; border-radius: 0.7rem;
    background: #fdf0f0; color: #8a1f1f; border: 1px solid #e0b4b4;
  }
  .msg.show { display: block; }
  .busy { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>送點數給朋友</h1>
  <p class="lead">幫爸媽買點數，他們就能用銀爺爺修老照片、讓照片動起來。</p>

  <div class="steps">
    <ol>
      <li>選一個方案，完成付款</li>
      <li>用 LINE 選一位朋友送出禮物</li>
      <li>朋友點一下「收下禮物」，點數就進他的帳戶</li>
    </ol>
  </div>

  {% for pkg in packages %}
  <button class="pkg" data-package="{{ pkg.id }}">
    <span class="points">{{ pkg.label }}</span>
    <span class="price">NT${{ pkg.price_twd }}</span>
  </button>
  {% endfor %}

  <p class="msg" id="msg"></p>

  <p class="note">
    卡片沒有使用期限，點數不會過期。<br>
    付款由綠界科技處理，本服務不會看到您的信用卡資料。
  </p>
</div>

<script>
  var wrap = document.getElementById("wrap");
  var msg = document.getElementById("msg");

  function showError(text) {
    // Never use alert(): a modal dialog inside the LINE webview blocks it.
    msg.textContent = text;
    msg.classList.add("show");
    wrap.classList.remove("busy");
  }

  function submitToGateway(action, params) {
    // ECPay's checkout is a plain form POST; build and submit it.
    var form = document.createElement("form");
    form.method = "POST";
    form.action = action;
    Object.keys(params).forEach(function (key) {
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = key;
      input.value = params[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }

  function buy(packageId) {
    msg.classList.remove("show");
    wrap.classList.add("busy");

    fetch("/gift/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ package_id: packageId })
    })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body.error || "現在無法付款，麻煩晚一點再試。");
          return body;
        });
      })
      .then(function (body) { submitToGateway(body.action, body.params); })
      .catch(function (err) { showError(err.message); });
  }

  document.querySelectorAll(".pkg").forEach(function (btn) {
    btn.addEventListener("click", function () { buy(btn.dataset.package); });
  });
</script>
</body>
</html>
