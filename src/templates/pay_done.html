<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款完成</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    margin: 0; padding: 2rem 1.5rem 3rem; line-height: 1.7;
    color: #1a1a1a; background: #fff;
    -webkit-text-size-adjust: 100%;
  }
  .box { max-width: 22rem; margin: 2rem auto 0; text-align: center; }

  /* Same success mark as the gift page, so paying feels like one product. */
  .success {
    width: 4.5rem; height: 4.5rem; margin: 0.5rem auto 1.25rem;
    border-radius: 50%; background: #06c755;
    display: flex; align-items: center; justify-content: center;
    animation: pop 0.4s ease-out;
  }
  .success svg { width: 2.4rem; height: 2.4rem; }
  .success path {
    stroke: #fff; stroke-width: 3; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 30; stroke-dashoffset: 30;
    animation: draw 0.4s ease-out 0.2s forwards;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 { font-size: 1.8rem; margin: 0 0 0.6rem; }
  p { font-size: 1.2rem; margin: 0 0 0.6rem; }
  .hint { color: #888; font-size: 1.05rem; margin-top: 1.2rem; }
  .amount {
    margin: 1.25rem auto 0.25rem; padding: 1.1rem 1.25rem; max-width: 18rem;
    background: #faf7f2; border-radius: 0.8rem;
  }
  .amount .label { font-size: 1rem; color: #888; margin-bottom: 0.2rem; }
  .amount .pts { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; }
</style>
</head>
<body>
  <div class="box">
    <div class="success" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-11"/></svg>
    </div>
    <h1>付款完成</h1>
    <p>謝謝您的購買 ☺️</p>
    {% if points %}
    <div class="amount">
      <div class="label">💎 購買內容</div>
      <div class="pts">銀爺爺點數 {{ points }} 點</div>
    </div>
    {% endif %}
    <p class="hint">可以關閉這個頁面了。</p>
  </div>
</body>
</html>
