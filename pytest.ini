[pytest]
testpaths = test
# test/ holds conftest.py (shared fakes) and the repo root holds src/ + scripts/
pythonpath = . test
# test_local.py is a manual smoke script that talks to a running server over
# HTTP — it is not part of the automated (fully offline) suite.
addopts = -q --strict-markers --ignore=test/test_local.py
# linebot SDK v2 flags its own to_snake_case call as deprecated whenever a
# dict-form Flex message is serialised. We're on the v2 API on purpose; it's the
# SDK's internal call, harmless and out of our control. Silence just that class.
filterwarnings =
    ignore::linebot.deprecations.LineBotSdkDeprecatedIn30
